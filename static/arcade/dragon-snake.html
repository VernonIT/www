<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

const GRID_SIZE = 25;
const CELL_SIZE = 22;
const INITIAL_SPEED = 140;
const MIN_SPEED = 80;
const GAP_WIDTH = 3;

const HEADS = [
  { id: "fox", emoji: "🦊", label: "Fox" },
  { id: "rooster", emoji: "🐓", label: "Rooster" },
  { id: "dragon", emoji: "🐉", label: "Dragon" },
  { id: "bear", emoji: "🐻", label: "Bear" },
  { id: "goat", emoji: "🐐", label: "Goat" },
];

const FRUITS = [
  { id: "apple", emoji: "🍎", color: "#e74c3c", label: "Apple" },
  { id: "banana", emoji: "🍌", color: "#f1c40f", label: "Banana" },
  { id: "mango", emoji: "🥭", color: "#e67e22", label: "Mango" },
  { id: "kiwi", emoji: "🥝", color: "#27ae60", label: "Kiwi" },
  { id: "dragonfruit", emoji: "🐲", color: "#e84393", label: "Dragon Fruit" },
  { id: "lime", emoji: "🍈", color: "#00e676", label: "Lime" },
  { id: "blueberry", emoji: "🫐", color: "#5c6bc0", label: "Blueberry" },
  { id: "peach", emoji: "🍑", color: "#ffab91", label: "Peach" },
];

const DIRS = {
  UP: { x: 0, y: -1 },
  DOWN: { x: 0, y: 1 },
  LEFT: { x: -1, y: 0 },
  RIGHT: { x: 1, y: 0 },
};

const OPPOSITE = { UP: "DOWN", DOWN: "UP", LEFT: "RIGHT", RIGHT: "LEFT" };
const WALLS = ["top", "bottom", "left", "right"];

function randomFruit() {
  return FRUITS[Math.floor(Math.random() * FRUITS.length)];
}

function randomGap(excludeWall) {
  let wall;
  do {
    wall = WALLS[Math.floor(Math.random() * 4)];
  } while (wall === excludeWall);
  const maxPos = GRID_SIZE - GAP_WIDTH - 2;
  const pos = Math.floor(Math.random() * maxPos) + 1;
  return { wall, pos };
}

function isInGap(x, y, gap) {
  if (!gap) return false;
  const { wall, pos } = gap;
  if (wall === "top" && y === 0) return x >= pos && x < pos + GAP_WIDTH;
  if (wall === "bottom" && y === GRID_SIZE - 1) return x >= pos && x < pos + GAP_WIDTH;
  if (wall === "left" && x === 0) return y >= pos && y < pos + GAP_WIDTH;
  if (wall === "right" && x === GRID_SIZE - 1) return y >= pos && y < pos + GAP_WIDTH;
  return false;
}

function getWrapPosition(x, y, gap) {
  const { wall } = gap;
  if (wall === "top" || wall === "bottom") {
    return { x, y: wall === "top" ? GRID_SIZE - 1 : 0 };
  }
  return { x: wall === "left" ? GRID_SIZE - 1 : 0, y };
}

function isWall(x, y) {
  return x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE;
}

function spawnFruit(snake) {
  const occupied = new Set(snake.map((s) => `${s.x},${s.y}`));
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * (GRID_SIZE - 2)) + 1,
      y: Math.floor(Math.random() * (GRID_SIZE - 2)) + 1,
    };
  } while (occupied.has(`${pos.x},${pos.y}`));
  return { ...pos, ...randomFruit() };
}

function Particles({ particles }) {
  return particles.map((p) => (
    <div
      key={p.id}
      style={{
        position: "absolute",
        left: p.x * CELL_SIZE + CELL_SIZE / 2 + p.ox,
        top: p.y * CELL_SIZE + CELL_SIZE / 2 + p.oy,
        width: 6,
        height: 6,
        borderRadius: "50%",
        backgroundColor: p.color,
        opacity: p.life,
        transform: `scale(${p.life})`,
        transition: "all 0.3s ease-out",
        pointerEvents: "none",
        zIndex: 100,
      }}
    />
  ));
}

function CharacterSelect({ onSelect }) {
  const [selected, setSelected] = useState(null);
  const [hovered, setHovered] = useState(null);

  return (
    <div style={{
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      minHeight: "100vh", background: "linear-gradient(165deg, #0a0a12 0%, #12121f 40%, #1a0a1e 100%)",
      fontFamily: "'Segoe UI', system-ui, sans-serif", color: "#e8e0f0", padding: 20,
    }}>
      <div style={{
        fontSize: 48, marginBottom: 4, filter: "drop-shadow(0 0 20px rgba(255,180,50,0.4))",
        animation: "float 3s ease-in-out infinite",
      }}>🐉</div>
      <h1 style={{
        fontSize: 36, fontWeight: 800, margin: "0 0 6px",
        background: "linear-gradient(135deg, #ffd700, #ff6b35, #ff2d95)",
        WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
        letterSpacing: 2, textTransform: "uppercase",
      }}>Dragon Snake</h1>
      <p style={{ color: "#8a7fa0", fontSize: 14, marginBottom: 28, letterSpacing: 1 }}>
        Choose your dragon's spirit
      </p>

      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", justifyContent: "center", marginBottom: 32 }}>
        {HEADS.map((h) => {
          const isSel = selected === h.id;
          const isHov = hovered === h.id;
          return (
            <div
              key={h.id}
              onClick={() => setSelected(h.id)}
              onMouseEnter={() => setHovered(h.id)}
              onMouseLeave={() => setHovered(null)}
              style={{
                width: 100, height: 110, display: "flex", flexDirection: "column",
                alignItems: "center", justifyContent: "center", gap: 6,
                borderRadius: 16, cursor: "pointer", transition: "all 0.25s ease",
                background: isSel
                  ? "linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,100,50,0.15))"
                  : isHov ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)",
                border: isSel ? "2px solid #ffd700" : "2px solid rgba(255,255,255,0.08)",
                transform: isSel ? "scale(1.1)" : isHov ? "scale(1.05)" : "scale(1)",
                boxShadow: isSel ? "0 0 24px rgba(255,215,0,0.3)" : "none",
              }}
            >
              <span style={{ fontSize: 40 }}>{h.emoji}</span>
              <span style={{
                fontSize: 12, fontWeight: 600, letterSpacing: 1, textTransform: "uppercase",
                color: isSel ? "#ffd700" : "#8a7fa0",
              }}>{h.label}</span>
            </div>
          );
        })}
      </div>

      <button
        disabled={!selected}
        onClick={() => selected && onSelect(HEADS.find((h) => h.id === selected))}
        style={{
          padding: "14px 48px", fontSize: 16, fontWeight: 700, letterSpacing: 2,
          textTransform: "uppercase", border: "none", borderRadius: 12, cursor: selected ? "pointer" : "not-allowed",
          background: selected
            ? "linear-gradient(135deg, #ffd700, #ff6b35)"
            : "rgba(255,255,255,0.08)",
          color: selected ? "#0a0a12" : "#555",
          boxShadow: selected ? "0 4px 24px rgba(255,180,50,0.4)" : "none",
          transition: "all 0.3s ease",
          transform: selected ? "scale(1)" : "scale(0.95)",
        }}
      >
        Begin Hunt
      </button>

      <div style={{ marginTop: 32, display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center" }}>
        {FRUITS.map((f) => (
          <span key={f.id} title={f.label} style={{ fontSize: 20, opacity: 0.7 }}>{f.emoji}</span>
        ))}
      </div>
      <p style={{ color: "#5a5270", fontSize: 11, marginTop: 8, letterSpacing: 0.5 }}>
        Eat fruit to paint your dragon's tail
      </p>

      <style>{`
        @keyframes float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-8px); }
        }
      `}</style>
    </div>
  );
}

function GameOver({ score, length, highScore, isNewHigh, onRestart }) {
  return (
    <div style={{
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      minHeight: "100vh", background: "linear-gradient(165deg, #0a0a12 0%, #12121f 40%, #1a0a1e 100%)",
      fontFamily: "'Segoe UI', system-ui, sans-serif", color: "#e8e0f0", padding: 20,
    }}>
      {isNewHigh && (
        <div style={{
          fontSize: 14, fontWeight: 700, color: "#ffd700", letterSpacing: 3,
          textTransform: "uppercase", marginBottom: 12,
          textShadow: "0 0 20px rgba(255,215,0,0.6)",
          animation: "pulse 1.5s ease-in-out infinite",
        }}>
          ✨ New High Score! ✨
        </div>
      )}

      <h1 style={{
        fontSize: 32, fontWeight: 800, margin: "0 0 24px",
        color: "#ff4757", textTransform: "uppercase", letterSpacing: 3,
      }}>Game Over</h1>

      <div style={{ display: "flex", gap: 24, marginBottom: 32 }}>
        {[
          { label: "Score", value: score, color: "#ffd700" },
          { label: "Length", value: length, color: "#00e676" },
          { label: "Best", value: highScore, color: isNewHigh ? "#ffd700" : "#8a7fa0" },
        ].map((stat) => (
          <div key={stat.label} style={{
            textAlign: "center", padding: "16px 24px", borderRadius: 12,
            background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.08)",
          }}>
            <div style={{ fontSize: 32, fontWeight: 800, color: stat.color }}>{stat.value}</div>
            <div style={{ fontSize: 11, color: "#8a7fa0", letterSpacing: 1, textTransform: "uppercase", marginTop: 4 }}>
              {stat.label}
            </div>
          </div>
        ))}
      </div>

      <button
        onClick={onRestart}
        style={{
          padding: "14px 48px", fontSize: 16, fontWeight: 700, letterSpacing: 2,
          textTransform: "uppercase", border: "none", borderRadius: 12, cursor: "pointer",
          background: "linear-gradient(135deg, #ffd700, #ff6b35)",
          color: "#0a0a12",
          boxShadow: "0 4px 24px rgba(255,180,50,0.4)",
          transition: "all 0.2s ease",
        }}
      >
        Play Again
      </button>

      <style>{`
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.6; }
        }
      `}</style>
    </div>
  );
}

function GameBoard({ head, highScore, setHighScore }) {
  const startSnake = [
    { x: 5, y: 12, color: "#ffd700" },
    { x: 4, y: 12, color: "#ffb700" },
    { x: 3, y: 12, color: "#ff9500" },
  ];

  const [snake, setSnake] = useState(startSnake);
  const [dir, setDir] = useState("RIGHT");
  const [fruit, setFruit] = useState(() => spawnFruit(startSnake));
  const [gap, setGap] = useState(() => randomGap(null));
  const [score, setScore] = useState(0);
  const [dead, setDead] = useState(false);
  const [particles, setParticles] = useState([]);
  const [flash, setFlash] = useState(false);

  const dirRef = useRef(dir);
  const queueRef = useRef([]);
  const snakeRef = useRef(snake);
  const fruitRef = useRef(fruit);
  const gapRef = useRef(gap);
  const scoreRef = useRef(score);
  const deadRef = useRef(dead);
  const tickRef = useRef(null);
  const particleIdRef = useRef(0);

  dirRef.current = dir;
  snakeRef.current = snake;
  fruitRef.current = fruit;
  gapRef.current = gap;
  scoreRef.current = score;
  deadRef.current = dead;

  const getSpeed = useCallback(() => {
    return Math.max(MIN_SPEED, INITIAL_SPEED - scoreRef.current * 2);
  }, []);

  useEffect(() => {
    const keyMap = {
      ArrowUp: "UP", ArrowDown: "DOWN", ArrowLeft: "LEFT", ArrowRight: "RIGHT",
      w: "UP", s: "DOWN", a: "LEFT", d: "RIGHT",
      W: "UP", S: "DOWN", A: "LEFT", D: "RIGHT",
    };
    const handler = (e) => {
      const newDir = keyMap[e.key];
      if (!newDir) return;
      e.preventDefault();
      queueRef.current.push(newDir);
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, []);

  const spawnParticles = useCallback((x, y, color) => {
    const newP = [];
    for (let i = 0; i < 8; i++) {
      const angle = (Math.PI * 2 * i) / 8;
      newP.push({
        id: particleIdRef.current++,
        x, y, color,
        ox: Math.cos(angle) * 18,
        oy: Math.sin(angle) * 18,
        life: 1,
      });
    }
    setParticles((prev) => [...prev, ...newP]);
    setTimeout(() => {
      setParticles((prev) => prev.map((p) => newP.find((n) => n.id === p.id) ? { ...p, life: 0, ox: p.ox * 2.5, oy: p.oy * 2.5 } : p));
    }, 30);
    setTimeout(() => {
      const ids = new Set(newP.map((n) => n.id));
      setParticles((prev) => prev.filter((p) => !ids.has(p.id)));
    }, 350);
  }, []);

  useEffect(() => {
    if (dead) return;

    const tick = () => {
      let currentDir = dirRef.current;
      while (queueRef.current.length > 0) {
        const nextDir = queueRef.current.shift();
        if (nextDir !== OPPOSITE[currentDir]) {
          currentDir = nextDir;
          break;
        }
      }
      setDir(currentDir);
      dirRef.current = currentDir;

      const s = snakeRef.current;
      const headPos = s[0];
      const delta = DIRS[currentDir];
      let nx = headPos.x + delta.x;
      let ny = headPos.y + delta.y;

      const g = gapRef.current;
      if (isWall(nx, ny)) {
        const wallX = nx < 0 ? 0 : nx >= GRID_SIZE ? GRID_SIZE - 1 : nx;
        const wallY = ny < 0 ? 0 : ny >= GRID_SIZE ? GRID_SIZE - 1 : ny;

        if (isInGap(wallX, wallY, g)) {
          const wrapped = getWrapPosition(wallX, wallY, g);
          nx = wrapped.x;
          ny = wrapped.y;
          const newGap = randomGap(g.wall);
          setGap(newGap);
          gapRef.current = newGap;
        } else {
          setDead(true);
          deadRef.current = true;
          const finalScore = scoreRef.current;
          if (finalScore > highScore) setHighScore(finalScore);
          return;
        }
      }

      for (let i = 0; i < s.length; i++) {
        if (s[i].x === nx && s[i].y === ny) {
          setDead(true);
          deadRef.current = true;
          const finalScore = scoreRef.current;
          if (finalScore > highScore) setHighScore(finalScore);
          return;
        }
      }

      const newHead = { x: nx, y: ny, color: s[0].color };
      let newSnake;

      const f = fruitRef.current;
      if (nx === f.x && ny === f.y) {
        newSnake = [newHead, ...s];
        newSnake[newSnake.length - 1] = { ...newSnake[newSnake.length - 1], color: f.color };

        const newScore = scoreRef.current + 1;
        setScore(newScore);
        scoreRef.current = newScore;

        const newFruit = spawnFruit(newSnake);
        setFruit(newFruit);
        fruitRef.current = newFruit;

        spawnParticles(f.x, f.y, f.color);
        setFlash(true);
        setTimeout(() => setFlash(false), 150);
      } else {
        newSnake = [newHead, ...s.slice(0, -1)];
      }

      setSnake(newSnake);
      snakeRef.current = newSnake;

      tickRef.current = setTimeout(tick, getSpeed());
    };

    tickRef.current = setTimeout(tick, getSpeed());
    return () => clearTimeout(tickRef.current);
  }, [dead, highScore, setHighScore, getSpeed, spawnParticles]);

  if (dead) {
    const isNewHigh = score >= highScore && score > 0;
    return (
      <GameOver
        score={score}
        length={snake.length}
        highScore={Math.max(score, highScore)}
        isNewHigh={isNewHigh}
        onRestart={() => { window.__dragonSnakeRestart?.(); }}
      />
    );
  }

  const boardPx = GRID_SIZE * CELL_SIZE;

  const wallCells = [];
  for (let i = 0; i < GRID_SIZE; i++) {
    if (!isInGap(i, 0, gap)) wallCells.push({ x: i, y: 0 });
    if (!isInGap(i, GRID_SIZE - 1, gap)) wallCells.push({ x: i, y: GRID_SIZE - 1 });
    if (i > 0 && i < GRID_SIZE - 1 && !isInGap(0, i, gap)) wallCells.push({ x: 0, y: i });
    if (i > 0 && i < GRID_SIZE - 1 && !isInGap(GRID_SIZE - 1, i, gap)) wallCells.push({ x: GRID_SIZE - 1, y: i });
  }

  const gapCells = [];
  for (let i = 0; i < GRID_SIZE; i++) {
    if (isInGap(i, 0, gap)) gapCells.push({ x: i, y: 0 });
    if (isInGap(i, GRID_SIZE - 1, gap)) gapCells.push({ x: i, y: GRID_SIZE - 1 });
    if (i > 0 && i < GRID_SIZE - 1) {
      if (isInGap(0, i, gap)) gapCells.push({ x: 0, y: i });
      if (isInGap(GRID_SIZE - 1, i, gap)) gapCells.push({ x: GRID_SIZE - 1, y: i });
    }
  }

  return (
    <div style={{
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
      minHeight: "100vh", background: "linear-gradient(165deg, #0a0a12 0%, #12121f 40%, #1a0a1e 100%)",
      fontFamily: "'Segoe UI', system-ui, sans-serif", color: "#e8e0f0", padding: 20,
    }}>
      <div style={{ display: "flex", gap: 24, marginBottom: 12, fontSize: 13, letterSpacing: 1 }}>
        <span style={{ color: "#ffd700" }}>SCORE: <b>{score}</b></span>
        <span style={{ color: "#00e676" }}>LENGTH: <b>{snake.length}</b></span>
        <span style={{ color: "#8a7fa0" }}>BEST: <b>{Math.max(highScore, score)}</b></span>
        <span style={{ fontSize: 18 }}>{head.emoji}</span>
      </div>

      <div style={{
        position: "relative",
        width: boardPx, height: boardPx,
        background: "rgba(10, 10, 20, 0.9)",
        borderRadius: 4,
        overflow: "hidden",
        boxShadow: flash
          ? `0 0 40px rgba(255,255,255, 0.2), inset 0 0 30px rgba(255,255,255,0.05)`
          : "0 0 40px rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.02)",
        transition: "box-shadow 0.15s ease",
      }}>
        <svg width={boardPx} height={boardPx} style={{ position: "absolute", top: 0, left: 0, opacity: 0.04 }}>
          {Array.from({ length: GRID_SIZE }, (_, i) => (
            <line key={`h${i}`} x1={0} y1={i * CELL_SIZE} x2={boardPx} y2={i * CELL_SIZE} stroke="#fff" strokeWidth={0.5} />
          ))}
          {Array.from({ length: GRID_SIZE }, (_, i) => (
            <line key={`v${i}`} x1={i * CELL_SIZE} y1={0} x2={i * CELL_SIZE} y2={boardPx} stroke="#fff" strokeWidth={0.5} />
          ))}
        </svg>

        {wallCells.map((w, i) => (
          <div key={`w${i}`} style={{
            position: "absolute", left: w.x * CELL_SIZE, top: w.y * CELL_SIZE,
            width: CELL_SIZE, height: CELL_SIZE,
            background: "linear-gradient(135deg, #2a1a3a, #1a1028)",
            border: "1px solid rgba(120, 80, 160, 0.3)",
            boxSizing: "border-box",
          }} />
        ))}

        {gapCells.map((g, i) => (
          <div key={`g${i}`} style={{
            position: "absolute", left: g.x * CELL_SIZE, top: g.y * CELL_SIZE,
            width: CELL_SIZE, height: CELL_SIZE,
            background: "rgba(0, 230, 118, 0.08)",
            border: "1px dashed rgba(0, 230, 118, 0.4)",
            boxSizing: "border-box",
            boxShadow: "0 0 8px rgba(0, 230, 118, 0.2)",
            animation: "gapPulse 2s ease-in-out infinite",
          }} />
        ))}

        <div style={{
          position: "absolute",
          left: fruit.x * CELL_SIZE, top: fruit.y * CELL_SIZE,
          width: CELL_SIZE, height: CELL_SIZE,
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 16,
          filter: `drop-shadow(0 0 6px ${fruit.color})`,
          animation: "fruitBob 1.5s ease-in-out infinite",
        }}>
          {fruit.emoji}
        </div>

        {[...snake].reverse().map((seg, ri) => {
          const i = snake.length - 1 - ri;
          const isHead = i === 0;
          const segSize = isHead ? CELL_SIZE : CELL_SIZE - 2;
          const offset = isHead ? 0 : 1;
          const opacity = Math.max(0.5, 1 - (i / snake.length) * 0.5);
          const borderRadius = isHead ? 6 : Math.max(4, 8 - i * 0.3);

          return (
            <div
              key={i}
              style={{
                position: "absolute",
                left: seg.x * CELL_SIZE + offset,
                top: seg.y * CELL_SIZE + offset,
                width: segSize, height: segSize,
                borderRadius,
                background: isHead ? "rgba(40, 30, 50, 0.9)" : seg.color,
                opacity,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: isHead ? 16 : 0,
                boxShadow: isHead ? "0 0 10px rgba(255,215,0,0.3)" : `0 0 4px ${seg.color}44`,
                zIndex: isHead ? 50 : 40 - i,
                transition: "background 0.1s",
              }}
            >
              {isHead ? head.emoji : null}
            </div>
          );
        })}

        <Particles particles={particles} />
      </div>

      <p style={{ color: "#5a5270", fontSize: 11, marginTop: 10, letterSpacing: 0.5 }}>
        Arrow keys or WASD to move · Find the <span style={{ color: "#00e676" }}>green gap</span> to warp
      </p>

      <style>{`
        @keyframes gapPulse {
          0%, 100% { opacity: 0.6; }
          50% { opacity: 1; }
        }
        @keyframes fruitBob {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-2px); }
        }
      `}</style>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("select");
  const [selectedHead, setSelectedHead] = useState(null);
  const [highScore, setHighScore] = useState(0);

  const restartToSelect = useCallback(() => {
    setScreen("select");
    setSelectedHead(null);
  }, []);

  useEffect(() => {
    window.__dragonSnakeRestart = restartToSelect;
    return () => { delete window.__dragonSnakeRestart; };
  }, [restartToSelect]);

  if (screen === "select") {
    return (
      <CharacterSelect
        onSelect={(head) => {
          setSelectedHead(head);
          setScreen("game");
        }}
      />
    );
  }

  return (
    <GameBoard
      key={Date.now()}
      head={selectedHead}
      highScore={highScore}
      setHighScore={setHighScore}
    />
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
