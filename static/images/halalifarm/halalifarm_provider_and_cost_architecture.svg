<svg width="680" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Agent task -->
<rect x="40" y="30" width="160" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="120" y="56" text-anchor="middle" font-weight="500" font-size="14" fill="#712B13">Agent task</text>
<line x1="200" y1="52" x2="250" y2="52" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Budget gate -->
<rect x="250" y="20" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" font-weight="500" font-size="14" fill="#633806">Budget gate</text>
<text x="340" y="60" text-anchor="middle" font-size="12" fill="#854F0B">Check limits first</text>
<line x1="430" y1="48" x2="480" y2="48" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Over budget -->
<text x="500" y="30" font-size="12" fill="#5F5E5A">Over budget?</text>
<rect x="480" y="38" width="160" height="36" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="560" y="60" text-anchor="middle" font-size="12" fill="#791F1F">Block + ask user</text>

<!-- Under budget -->
<line x1="340" y1="76" x2="340" y2="120" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="105" font-size="12" fill="#5F5E5A">Within budget</text>

<!-- Provider router -->
<rect x="220" y="120" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="142" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Provider router</text>
<text x="340" y="160" text-anchor="middle" font-size="12" fill="#0F6E56">Reads agent.provider field</text>

<!-- Router to providers -->
<line x1="280" y1="176" x2="120" y2="240" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="176" x2="340" y2="240" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="176" x2="560" y2="240" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Providers -->
<rect x="40" y="240" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="120" y="266" text-anchor="middle" font-weight="500" font-size="14" fill="#3C3489">Anthropic</text>

<rect x="260" y="240" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="266" text-anchor="middle" font-weight="500" font-size="14" fill="#0C447C">OpenAI</text>

<rect x="480" y="240" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="560" y="266" text-anchor="middle" font-weight="500" font-size="14" fill="#444441">Gemini / other</text>

<!-- Returns through ledger -->
<line x1="120" y1="284" x2="120" y2="340" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="284" x2="340" y2="340" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="560" y1="284" x2="560" y2="340" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Ledger -->
<rect x="60" y="340" width="560" height="56" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="340" y="362" text-anchor="middle" font-weight="500" font-size="14" fill="#27500A">Token ledger</text>
<text x="340" y="380" text-anchor="middle" font-size="12" fill="#3B6D11">Log: provider, model, tokens in/out, cost, project, agent, task</text>

<!-- Storage -->
<line x1="340" y1="396" x2="340" y2="430" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240" y="430" width="200" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="452" text-anchor="middle" font-size="12" fill="#444441">SQLite / cost.db</text>
</svg>
