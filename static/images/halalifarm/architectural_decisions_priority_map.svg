<svg width="680" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">

<!-- Header -->
<text x="340" y="24" text-anchor="middle" font-weight="500" font-size="14" fill="#2C2C2A">Decide now vs. decide later</text>
<text x="170" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">Painful to change later</text>
<text x="510" y="52" text-anchor="middle" font-size="12" fill="#5F5E5A">Safe to evolve</text>
<line x1="340" y1="62" x2="340" y2="500" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- Left: decide now -->
<rect x="40" y="72" width="260" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="170" y="94" text-anchor="middle" font-weight="500" font-size="14" fill="#791F1F">Task DAG format</text>
<text x="170" y="112" text-anchor="middle" font-size="12" fill="#A32D2D">Dependencies, parallel execution</text>

<rect x="40" y="144" width="260" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="170" y="166" text-anchor="middle" font-weight="500" font-size="14" fill="#791F1F">Context assembly</text>
<text x="170" y="184" text-anchor="middle" font-size="12" fill="#A32D2D">What each agent sees per call</text>

<rect x="40" y="216" width="260" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="170" y="238" text-anchor="middle" font-weight="500" font-size="14" fill="#791F1F">Task state machine</text>
<text x="170" y="256" text-anchor="middle" font-size="12" fill="#A32D2D">pending → ready → done / failed</text>

<rect x="40" y="288" width="260" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="170" y="310" text-anchor="middle" font-weight="500" font-size="14" fill="#791F1F">Output contracts</text>
<text x="170" y="328" text-anchor="middle" font-size="12" fill="#A32D2D">What agents hand off to each other</text>

<rect x="40" y="360" width="260" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="170" y="382" text-anchor="middle" font-weight="500" font-size="14" fill="#791F1F">Agent communication</text>
<text x="170" y="400" text-anchor="middle" font-size="12" fill="#A32D2D">Relay vs. shared doc</text>

<!-- Right: safe to evolve -->
<rect x="380" y="72" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="94" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Number of agents</text>
<text x="510" y="112" text-anchor="middle" font-size="12" fill="#0F6E56">Start with 3-4, add as needed</text>

<rect x="380" y="144" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="166" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Model assignments</text>
<text x="510" y="184" text-anchor="middle" font-size="12" fill="#0F6E56">Swap models anytime</text>

<rect x="380" y="216" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="238" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Project templates</text>
<text x="510" y="256" text-anchor="middle" font-size="12" fill="#0F6E56">Refine structure over time</text>

<rect x="380" y="288" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="310" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Skill modules</text>
<text x="510" y="328" text-anchor="middle" font-size="12" fill="#0F6E56">Add domain knowledge anytime</text>

<rect x="380" y="360" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="510" y="382" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Review checkpoints</text>
<text x="510" y="400" text-anchor="middle" font-size="12" fill="#0F6E56">Add quality gates incrementally</text>

<!-- Already decided -->
<rect x="40" y="440" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="462" text-anchor="middle" font-weight="500" font-size="14" fill="#444441">Already decided</text>
<text x="340" y="480" text-anchor="middle" font-size="12" fill="#5F5E5A">Go CLI, multi-provider, token ledger, project registry, workspace separation</text>
</svg>
