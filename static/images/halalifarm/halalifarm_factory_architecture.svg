<svg width="680" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- You -->
<rect x="270" y="20" width="140" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="46" text-anchor="middle" font-weight="500" font-size="14" fill="#633806">You</text>
<line x1="340" y1="64" x2="340" y2="100" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Factory container -->
<rect x="40" y="100" width="600" height="340" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" font-weight="500" font-size="14" fill="#3C3489">halalifarm — software factory</text>

<!-- PM -->
<rect x="240" y="148" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="170" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">Project manager</text>
<text x="340" y="188" text-anchor="middle" font-size="12" fill="#0F6E56">Intake, planning, routing</text>

<!-- PM to SME arrows -->
<line x1="280" y1="204" x2="120" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="310" y1="204" x2="240" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="204" x2="340" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="370" y1="204" x2="460" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="204" x2="570" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- SME agents -->
<rect x="60" y="270" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="115" y="296" text-anchor="middle" font-weight="500" font-size="14" fill="#712B13">Architect</text>

<rect x="185" y="270" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="240" y="296" text-anchor="middle" font-weight="500" font-size="14" fill="#712B13">Security</text>

<rect x="305" y="270" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="360" y="296" text-anchor="middle" font-weight="500" font-size="14" fill="#712B13">Engineer</text>

<rect x="420" y="270" width="90" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="465" y="296" text-anchor="middle" font-weight="500" font-size="14" fill="#712B13">QA</text>

<rect x="520" y="270" width="110" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="575" y="296" text-anchor="middle" font-weight="500" font-size="14" fill="#712B13">Ops + more</text>

<!-- Registry -->
<rect x="190" y="360" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="382" text-anchor="middle" font-weight="500" font-size="14" fill="#444441">Project registry</text>
<text x="340" y="400" text-anchor="middle" font-size="12" fill="#5F5E5A">Active projects, state, context</text>

<!-- Registry to workspaces -->
<line x1="270" y1="416" x2="130" y2="480" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="416" x2="340" y2="480" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410" y1="416" x2="550" y2="480" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Project workspaces -->
<rect x="60" y="480" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="502" text-anchor="middle" font-weight="500" font-size="14" fill="#0C447C">dashcode</text>
<text x="130" y="520" text-anchor="middle" font-size="12" fill="#185FA5">~/projects/dashcode</text>

<rect x="270" y="480" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="502" text-anchor="middle" font-weight="500" font-size="14" fill="#0C447C">1lid</text>
<text x="340" y="520" text-anchor="middle" font-size="12" fill="#185FA5">~/projects/1lid</text>

<rect x="480" y="480" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="550" y="502" text-anchor="middle" font-weight="500" font-size="14" fill="#0C447C">vida</text>
<text x="550" y="520" text-anchor="middle" font-size="12" fill="#185FA5">~/projects/vida</text>

<!-- Annotations -->
<text x="340" y="570" text-anchor="middle" font-size="12" fill="#5F5E5A">Each project = separate repo, own brief, own backlog, own context</text>
<text x="340" y="590" text-anchor="middle" font-size="12" fill="#5F5E5A">Factory agents work IN the project workspace, not in halalifarm</text>
</svg>
