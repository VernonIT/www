<svg width="680" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- pending -->
<rect x="40" y="40" width="120" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="66" text-anchor="middle" font-weight="500" font-size="14" fill="#444441">pending</text>
<line x1="160" y1="62" x2="220" y2="62" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190" y="52" font-size="12" fill="#5F5E5A">deps met</text>

<!-- ready -->
<rect x="220" y="40" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="280" y="66" text-anchor="middle" font-weight="500" font-size="14" fill="#0C447C">ready</text>
<line x1="340" y1="62" x2="400" y2="62" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="370" y="52" font-size="12" fill="#5F5E5A">assigned</text>

<!-- in_progress -->
<rect x="400" y="40" width="140" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="470" y="66" text-anchor="middle" font-weight="500" font-size="14" fill="#3C3489">in_progress</text>

<!-- in_progress → in_review -->
<line x1="470" y1="84" x2="470" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490" y="118" font-size="12" fill="#5F5E5A">work done</text>

<!-- in_review -->
<rect x="400" y="140" width="140" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="470" y="166" text-anchor="middle" font-weight="500" font-size="14" fill="#085041">in_review</text>

<!-- in_review → done -->
<line x1="470" y1="184" x2="470" y2="240" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490" y="218" font-size="12" fill="#5F5E5A">approved</text>

<!-- done -->
<rect x="400" y="240" width="140" height="44" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="470" y="266" text-anchor="middle" font-weight="500" font-size="14" fill="#27500A">done</text>

<!-- in_review → in_progress (rework) -->
<path d="M400 162 L360 162 L360 72 L400 72" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330" y="118" text-anchor="end" font-size="12" fill="#5F5E5A">rework</text>

<!-- in_progress → failed -->
<rect x="560" y="108" width="100" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="610" y="134" text-anchor="middle" font-weight="500" font-size="14" fill="#791F1F">failed</text>
<path d="M540 62 L610 62 L610 108" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- in_progress → needs_human -->
<rect x="40" y="140" width="160" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="120" y="166" text-anchor="middle" font-weight="500" font-size="14" fill="#633806">needs_human</text>
<line x1="400" y1="72" x2="200" y2="152" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="280" y="98" text-anchor="middle" font-size="12" fill="#5F5E5A">stuck</text>

<!-- needs_human → in_progress (resolved) -->
<line x1="200" y1="162" x2="400" y2="52" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="280" y="138" text-anchor="middle" font-size="12" fill="#5F5E5A">resolved</text>

<!-- pending → blocked -->
<rect x="40" y="240" width="120" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="100" y="266" text-anchor="middle" font-weight="500" font-size="14" fill="#791F1F">blocked</text>
<line x1="100" y1="84" x2="100" y2="240" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="60" y="170" text-anchor="middle" font-size="12" fill="#5F5E5A">dep failed</text>

<!-- blocked → ready (unblocked) -->
<path d="M160 252 L220 252 L220 84" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="230" y="200" font-size="12" fill="#5F5E5A">unblocked</text>

<!-- Legend -->
<line x1="40" y1="340" x2="80" y2="340" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="344" font-size="12" fill="#5F5E5A">Normal transition</text>
<line x1="40" y1="365" x2="80" y2="365" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="90" y="369" font-size="12" fill="#5F5E5A">Recovery transition</text>
</svg>
