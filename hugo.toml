baseURL = 'https://vernonit.com/'
languageCode = 'en-us'
defaultContentLanguage = 'en'
title = 'VernonIT'
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = 'github.com/imfing/hextra'

[params]
  description = 'Full-lifecycle product engineering. Web apps, platforms, and backend infrastructure.'

  [params.author]
    name = 'David Vernon'
    email = ''

  [params.theme]
    default = 'light'
    displayToggle = true

  [params.navbar]
    displayTitle = true
    displayLogo = true

    [params.navbar.logo]
      path = '/vernonit-icon.png'
      link = '/'
      height = '32'
      width = '32'


  [params.footer]
    enable = true
    displayCopyright = false
    displayPoweredBy = false

  [params.search]
    enable = true
    type = 'flexsearch'

  [params.blog.list]
    sortBy = 'date'
    sortOrder = 'desc'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = 'monokai'

[[menu.main]]
  name = 'Home'
  pageRef = '/'
  weight = 1

[[menu.main]]
  name = 'About'
  pageRef = '/about'
  weight = 10

[[menu.main]]
  name = 'Blog'
  pageRef = '/blog'
  weight = 20

[[menu.main]]
  name = 'Contact'
  pageRef = '/contact'
  weight = 30
